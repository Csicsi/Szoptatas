name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :wear:assembleDebug
      - name: Build Play bundles (AAB)
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          ./gradlew --no-daemon :app:bundleRelease :wear:bundleRelease
          mkdir -p play
          cp app/build/outputs/bundle/release/app-release.aab play/noel-phone.aab
          cp wear/build/outputs/bundle/release/wear-release.aab play/noel-wear.aab
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Keep Play bundles as build artifact
        if: env.HAS_UPLOAD_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: play-bundles
          path: play/*.aab
      - name: Publish as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk szoptatas.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk szoptatas-wear.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create "v2.${GITHUB_RUN_NUMBER}" szoptatas.apk szoptatas-wear.apk \
            --title "Noel 2.${GITHUB_RUN_NUMBER}" --notes "${{ github.event.head_commit.message }}"
          # keep only the 5 newest releases
          gh release list --limit 100 --json tagName -q '.[5:][].tagName' | xargs -r -n1 gh release delete --yes --cleanup-tag
