name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :wear:assembleDebug
      - name: Publish as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk szoptatas.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk szoptatas-wear.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest szoptatas.apk szoptatas-wear.apk --title "Szoptatás ${GITHUB_SHA::7}" --notes "Automatic build"
